services:
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://corridor:corridor@postgres:5432/corridor
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:?set INTEGRATION_API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_KEY: ${LLM_KEY:-}
      TOMTOM_KEY: ${TOMTOM_KEY:-}
      OSRM_URL: ${OSRM_URL:-}
      NODE_ENV: production
      # Run the synthetic sim server-side for a demo deploy. For a real carrier
      # pilot, leave RUN_SIM unset — data comes from integrations (Phase F).
      RUN_SIM: ${RUN_SIM:-true}
      PORT: 8787
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: corridor
      POSTGRES_PASSWORD: corridor
      POSTGRES_DB: corridor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
